# Reusable: a pull request's title must be a Conventional Commit (feat:, fix:, chore:, ...). Merges are squashed, so the
# title becomes the commit semantic-release reads. A stacked PR (gh stack) is checked layer by layer the same way.
name: pr-title

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-26.04
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
